name: orbit-dashboard
version: 0.2.0
manifest_version: 2
api_version: 1
description: Use the approved ORBIT dashboard API to run Mac Studio ComfyUI jobs.
provides_tools:
  - orbit_status
  - orbit_list_workflows
  - orbit_create_job
  - orbit_list_jobs
  - orbit_get_job
  - orbit_wait_job
  - orbit_cancel_job
  - orbit_rerun_job
  - orbit_list_results
  - orbit_download_result
  - orbit_free_comfy_memory
python_dependencies:
  - "keyring>=25,<26"
requires_env:
  - name: ORBIT_DASHBOARD_URL
    description: "VPN/TLS ORBIT URL, for example https://orbit.internal.example"
  - name: ORBIT_DASHBOARD_ORIGIN
    description: "Exact browser origin allowed to pair with this PC"
license: MIT
tags: [comfyui, image-generation, video-generation, local-agent]
